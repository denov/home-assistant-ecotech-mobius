[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I", "RUF"]
# HA entities declare _attr_* lists on the class, as Home Assistant itself does
ignore = ["RUF012"]

[tool.ruff.lint.isort]
# Home Assistant's import style
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components", "mobius"]
